# brew tap-new uses this file to generate an autobump workflow for the new tap
name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  workflow_dispatch:
  schedule:
    # Every day at 9:25 UTC
    - cron: 25 9 * * *

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1

      - name: Bump formulae and casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew bump --no-fork --open-pr --bump-synced --tap="$TAP_NAME"

      # Nobody reviews this tap, so a bump lands as soon as it is opened.
      # `brew bump` has already downloaded the release and recorded its
      # checksum by then. Only the bot's own branches in this repository
      # qualify: a pull request from a fork is never merged here, whatever
      # its branch is called.
      - name: Merge the bumps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName,isCrossRepository,author \
            --jq '.[]
              | select(.isCrossRepository == false)
              | select(.author.is_bot == true)
              | select(.author.login == "app/github-actions")
              | select(.headRefName | startswith("bump-"))
              | .number' |
            while read -r number
            do
              gh pr merge "$number" --repo "$GITHUB_REPOSITORY" \
                --squash --delete-branch
            done
